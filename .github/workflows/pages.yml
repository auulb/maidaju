name: Deploy maidaju to GitHub Pages

on:
  push:
    branches: [gh-page]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/maidaju/package-lock.json
      - name: Install
        working-directory: apps/maidaju
        run: npm ci
      - name: Build
        working-directory: apps/maidaju
        env:
          BASE_PATH: /maidaju/
        run: npm run build
      - name: SPA fallback
        working-directory: apps/maidaju
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/maidaju/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
